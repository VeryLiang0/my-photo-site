<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站后台管理</title>
  <style>
    :root { --bg: #1e1e2e; --panel: #2a2a3c; --text: #ccc; --accent: #89b4fa; --danger: #f38ba8; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; color: #fff; }
    .section { background: var(--panel); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .section h2 { margin-bottom: 15px; font-size: 1.2rem; color: var(--accent); }
    label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
    input, textarea, select {
      width: 100%; padding: 8px; margin-bottom: 15px;
      background: #1e1e2e; border: 1px solid #444; color: #fff;
      border-radius: 4px; font-size: 1rem;
    }
    textarea { resize: vertical; min-height: 80px; }
    button {
      padding: 10px 20px; background: var(--accent); color: #000;
      border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .photo-item { border: 1px solid #444; border-radius: 4px; padding: 10px; margin-bottom: 10px; }
    .photo-item img { max-height: 100px; margin-bottom: 5px; border-radius: 4px; }
    .photo-item input { margin-bottom: 5px; }
    #status { margin-top: 20px; text-align: center; font-weight: bold; }
    .status-info { color: #89b4fa; }
    .status-success { color: #a6e3a1; }
    .status-error { color: #f38ba8; }
    .hint { font-size: 0.8rem; color: #888; margin-top: -10px; margin-bottom: 10px; }
    .hidden { display: none; }
    .bg-preview { max-width: 200px; max-height: 120px; margin: 10px 0; display: none; border-radius: 4px; }
    .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .checkbox-row input[type="checkbox"] { width: auto; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🖼️ 网站后台管理</h1>

    <div id="loginSection" class="section">
      <h2>输入 GitHub Token</h2>
      <input type="password" id="tokenInput" placeholder="粘贴你的 GitHub Personal Access Token">
      <button onclick="saveToken()">保存并登录</button>
      <p class="hint">Token 仅存储在浏览器中，请确保具有 repo 权限。</p>
    </div>

    <div id="editorSection" class="hidden">
      <div class="section">
        <h2>基本信息</h2>
        <label>摄影师名字</label><input type="text" id="siteName">
        <label>副标题</label><input type="text" id="subtitle">
        <label>拍摄风格</label><input type="text" id="style" placeholder="如：二次元、古风">
        <label>QQ账号（仅文本展示）</label><input type="text" id="qq" placeholder="如：123456789">
        <label>抖音号（前台固定显示“小林花花”）</label><input type="text" id="douyin" placeholder="yansheng7000" disabled title="前台已固定为“小林花花”">

        <label>网页背景</label>
        <select id="background" onchange="toggleCustomBg()">
          <option value="static">静态深色</option>
          <option value="gradient">流动渐变</option>
          <option value="particles">粒子星空</option>
          <option value="gradient-particles">渐变+粒子</option>
          <option value="custom">自定义背景图</option>
        </select>

        <div id="customBgSection" style="display:none;">
          <label>自定义背景图</label>
          <input type="text" id="customBgImage" placeholder="图片路径，如 images/bg.jpg">
          <input type="file" id="customBgFile" accept="image/*">
          <button onclick="uploadCustomBg()">上传背景图</button>
          <img id="customBgPreview" class="bg-preview" alt="背景预览">
          <div class="checkbox-row">
            <input type="checkbox" id="bgParticles">
            <label for="bgParticles" style="margin-bottom:0;">叠加粒子效果</label>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>作品列表</h2>
        <div id="photosContainer"></div>
        <button onclick="addPhoto()">+ 添加新作品</button>
        <p class="hint">
          📌 支持 JPG、PNG、WEBP。<br>
          ⚡ 单张 ≤ 40MB 原样上传，>40MB 自动压缩为 WebP。<br>
          🖼️ 系统将自动生成 400px 宽缩略图，前台瞬间加载。
        </p>
      </div>

      <button onclick="saveData()">💾 保存所有修改</button>
      <div id="status"></div>
    </div>
  </div>

  <script>
    const OWNER = 'VeryLiang0';
    const REPO = 'my-photo-site';
    const BRANCH = 'main';
    const DATA_PATH = 'data.json';
    const IMAGES_PATH = 'images/';

    let token = '';
    let currentData = {};

    function toggleCustomBg() {
      const bgType = document.getElementById('background').value;
      const section = document.getElementById('customBgSection');
      section.style.display = bgType === 'custom' ? 'block' : 'none';
    }

    async function uploadCustomBg() {
      const fileInput = document.getElementById('customBgFile');
      const file = fileInput.files[0];
      if (!file) return alert('请先选择一张图片');
      const statusEl = document.getElementById('status');
      statusEl.textContent = '正在上传背景图...';
      statusEl.className = 'status-info';
      try {
        const reader = new FileReader();
        const base64 = await new Promise((resolve, reject) => {
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const cleanName = 'bg_' + Date.now() + '_' + file.name.replace(/\s+/g, '_').replace(/\.[^/.]+$/, '.webp');
        const path = IMAGES_PATH + cleanName;
        await uploadBase64ToRepo(base64, path);
        document.getElementById('customBgImage').value = path;
        document.getElementById('customBgPreview').src = path;
        document.getElementById('customBgPreview').style.display = 'block';
        statusEl.textContent = '背景图上传成功！记得保存。';
        statusEl.className = 'status-success';
        fileInput.value = '';
      } catch (e) {
        statusEl.textContent = '❌ 上传失败: ' + e.message;
        statusEl.className = 'status-error';
      }
    }

    async function uploadBase64ToRepo(base64, path) {
      let sha = null;
      try {
        const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`, {
          headers: { Authorization: `token ${token}` }
        });
        if (getRes.ok) { const existing = await getRes.json(); sha = existing.sha; }
        else if (getRes.status !== 404) throw new Error(`检查文件状态失败 (${getRes.status})`);
      } catch(e) { if (!e.message.includes('404')) throw e; }

      const body = { message: `上传背景图`, content: base64, branch: BRANCH };
      if (sha) body.sha = sha;
      const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
        method: 'PUT',
        headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!putRes.ok) {
        const errData = await putRes.json();
        throw new Error(`上传失败 (${putRes.status}): ${errData.message}`);
      }
    }

    // ---------- 登录 ----------
    function saveToken() {
      const t = document.getElementById('tokenInput').value.trim();
      if (!t) return alert('请输入 Token');
      token = t;
      sessionStorage.setItem('gh_token', token);
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('editorSection').classList.remove('hidden');
      loadData();
    }
    (function () {
      const stored = sessionStorage.getItem('gh_token');
      if (stored) {
        token = stored;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('editorSection').classList.remove('hidden');
        loadData();
      }
    })();

    async function loadData() {
      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}?ref=${BRANCH}`, {
          headers: { Authorization: `token ${token}` }
        });
        if (!res.ok) throw new Error(`加载失败 (${res.status})`);
        const file = await res.json();
        const jsonStr = decodeURIComponent(escape(atob(file.content)));
        currentData = JSON.parse(jsonStr);
        fillForm(currentData);
      } catch (e) { alert('加载数据出错: ' + e.message); }
    }

    function fillForm(d) {
      document.getElementById('siteName').value = d.siteName || '';
      document.getElementById('subtitle').value = d.subtitle || '';
      document.getElementById('style').value = d.style || '';
      document.getElementById('qq').value = d.qq || '';
      document.getElementById('douyin').value = d.douyin || '';
      document.getElementById('background').value = d.background || 'static';
      document.getElementById('customBgImage').value = d.customBgImage || '';
      document.getElementById('bgParticles').checked = d.bgParticles || false;
      if (d.customBgImage) {
        document.getElementById('customBgPreview').src = d.customBgImage;
        document.getElementById('customBgPreview').style.display = 'block';
      }
      toggleCustomBg();
      renderPhotos(d.photos || []);
    }

    function renderPhotos(photos) {
      const container = document.getElementById('photosContainer');
      container.innerHTML = '';
      photos.forEach((p, i) => {
        const div = document.createElement('div'); div.className = 'photo-item';
        div.innerHTML = `
          <img src="${p.thumb || p.src}" alt="" onerror="this.style.display='none'" style="max-height:100px;">
          <label>缩略图</label><input type="text" class="photo-thumb" value="${p.thumb || ''}" placeholder="自动生成">
          <label>原图路径</label><input type="text" class="photo-src" value="${p.src}">
          <label>描述</label><input type="text" class="photo-alt" value="${p.alt || ''}">
          <input type="file" class="photo-file" accept="image/*" data-index="${i}">
          <button onclick="this.parentElement.remove()">删除</button>`;
        container.appendChild(div);
      });
    }

    function addPhoto() {
      const container = document.getElementById('photosContainer');
      const div = document.createElement('div'); div.className = 'photo-item';
      div.innerHTML = `
        <img src="" alt="" style="display:none;">
        <label>缩略图</label><input type="text" class="photo-thumb" value="" placeholder="上传后自动填充">
        <label>原图路径</label><input type="text" class="photo-src" value="" placeholder="上传后自动填充">
        <label>描述</label><input type="text" class="photo-alt" value="">
        <input type="file" class="photo-file" accept="image/*">
        <button onclick="this.parentElement.remove()">删除</button>`;
      container.appendChild(div);
    }

    async function uploadImage(file) {
      const needCompress = file.size > 40 * 1024 * 1024;
      let mainBlob = file, ext = file.name.split('.').pop().toLowerCase();
      if (needCompress) { mainBlob = await compressImage(file, 2000, 0.8); ext = 'webp'; }
      const thumbBlob = await compressImage(file, 400, 0.6);
      const mainPath = await uploadBlobToRepo(mainBlob, file.name, ext);
      const thumbPath = await uploadBlobToRepo(thumbBlob, 'thumb_' + file.name, 'webp');
      return { mainPath, thumbPath };
    }

    async function uploadBlobToRepo(blob, originalName, forceExt) {
      const reader = new FileReader();
      return new Promise((resolve, reject) => {
        reader.onload = async () => {
          const base64 = reader.result.split(',')[1];
          const cleanName = originalName.replace(/\s+/g, '_').replace(/\.[^/.]+$/, '');
          const fileName = Date.now() + '_' + cleanName + '.' + forceExt;
          const path = IMAGES_PATH + fileName;
          try {
            let sha = null;
            try {
              const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`, {
                headers: { Authorization: `token ${token}` }
              });
              if (getRes.ok) { const existing = await getRes.json(); sha = existing.sha; }
              else if (getRes.status !== 404) throw new Error(`检查文件状态失败 (${getRes.status})`);
            } catch(e) { if (!e.message.includes('404')) throw e; }
            const body = { message: `上传图片 ${fileName}`, content: base64, branch: BRANCH };
            if (sha) body.sha = sha;
            const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
              method: 'PUT',
              headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if (!putRes.ok) { const errData = await putRes.json(); throw new Error(`上传失败 (${putRes.status}): ${errData.message}`); }
            const data = await putRes.json();
            resolve(data.content.path);
          } catch (e) { reject(e); }
        };
        reader.readAsDataURL(blob);
      });
    }

    function compressImage(file, maxDimension, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = function() {
          let width = img.width, height = img.height;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) { height = Math.round((height * maxDimension) / width); width = maxDimension; }
            else { width = Math.round((width * maxDimension) / height); height = maxDimension; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => { if (blob) resolve(blob); else reject(new Error('压缩失败')); }, 'image/webp', quality);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    async function saveData() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = '⏳ 正在处理并保存...';
      statusEl.className = 'status-info';
      try {
        const fileInputs = document.querySelectorAll('.photo-file');
        for (const input of fileInputs) {
          if (input.files.length > 0) {
            const file = input.files[0];
            statusEl.textContent = `正在上传图片：${file.name}...`;
            const { mainPath, thumbPath } = await uploadImage(file);
            const item = input.closest('.photo-item');
            item.querySelector('.photo-src').value = mainPath;
            item.querySelector('.photo-thumb').value = thumbPath;
            const previewImg = item.querySelector('img');
            if (previewImg) { previewImg.src = thumbPath; previewImg.style.display = 'block'; }
            input.value = '';
          }
        }

        const newData = {
          siteName: document.getElementById('siteName').value.trim(),
          subtitle: document.getElementById('subtitle').value.trim(),
          style: document.getElementById('style').value.trim(),
          qq: document.getElementById('qq').value.trim(),
          douyin: document.getElementById('douyin').value.trim(),
          background: document.getElementById('background').value,
          customBgImage: document.getElementById('customBgImage').value.trim(),
          bgParticles: document.getElementById('bgParticles').checked,
          photos: []
        };
        const photoItems = document.querySelectorAll('.photo-item');
        photoItems.forEach(item => {
          const src = item.querySelector('.photo-src').value.trim();
          const thumb = item.querySelector('.photo-thumb').value.trim();
          if (src) newData.photos.push({ src, thumb: thumb || src, alt: item.querySelector('.photo-alt').value.trim() });
        });

        const jsonStr = JSON.stringify(newData);
        const encoder = new TextEncoder();
        const dataBytes = encoder.encode(jsonStr);
        const base64Content = btoa(String.fromCharCode(...new Uint8Array(dataBytes)));

        const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}?ref=${BRANCH}`, {
          headers: { Authorization: `token ${token}` }
        });
        if (!getRes.ok) throw new Error(`获取文件信息失败 (${getRes.status})`);
        const fileInfo = await getRes.json();

        const updateRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}`, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: '更新网站内容', content: base64Content, sha: fileInfo.sha, branch: BRANCH })
        });
        if (!updateRes.ok) { const errData = await updateRes.json(); throw new Error(`保存失败 (${updateRes.status}): ${errData.message}`); }

        statusEl.textContent = '✅ 保存成功！网站将在 1-2 分钟内更新。';
        statusEl.className = 'status-success';
        currentData = newData;
      } catch (e) {
        statusEl.textContent = '❌ ' + e.message;
        statusEl.className = 'status-error';
        console.error(e);
      }
    }
  </script>
</body>
</html>
